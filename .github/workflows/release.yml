name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build linux/amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Show Go version
        run: go version

      - name: Download modules
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Build static binary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o "simple-kv_${TAG}_linux_amd64" .

      - name: Generate checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum "simple-kv_${TAG}_linux_amd64" > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            simple-kv_${{ github.ref_name }}_linux_amd64
            checksums.txt
